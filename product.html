<!DOCTYPE html>
<html lang="ru">
<head>
  <script>document.documentElement.classList.add("js");</script>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5efe4" />
  <meta name="description" content="Карточка товара Gift Market 38 — состав, цена, доставка и списание токенами." />
  <title>Товар — Gift Market 38</title>
  <link rel="preload" href="assets/fonts/Fraunces.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="assets/fonts/DMSans.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body data-page="catalog" data-reload-on-city="true">
  <a class="skip-link" href="#main">Перейти к содержанию</a>
  <div data-chrome></div>
  <main class="page-main" id="main">
    <div class="container page-body page-body--pdp">
      <div id="pdp" class="pdp"></div>
    </div>
  </main>
  <footer class="site-footer site-footer--compact">
    <div class="container">
      <div class="site-footer__bottom">
        <span>Карточка товара</span>
        <span>Gift Market 38</span>
      </div>
    </div>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chrome.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const id = new URLSearchParams(location.search).get("id");
      const product = GM38.getProduct(id);
      const root = document.getElementById("pdp");
      if (!product) {
        root.innerHTML = `<div class="empty">Товар не найден. <a class="link-champagne" href="catalog.html">В каталог</a></div>`;
        return;
      }
      const store = GM38.getStore(product.storeId);
      const available = product.cities.includes(GM38.state.cityId);
      document.title = `${product.name} — Gift Market 38`;
      root.innerHTML = `
        <div class="pdp__gallery">
          <img src="${product.image}" alt="${product.name}" width="800" height="1000" />
        </div>
        <div class="pdp__info">
          <a class="pdp__back" href="catalog.html">← Вся коллекция</a>
          <p class="eyebrow">${store ? store.name : "Ателье"} · <span data-city-label></span></p>
          <h1 class="display display--lg">${product.name}</h1>
          <p class="lead">${product.desc}</p>
          <div class="pdp__price-row">
            <div class="pdp__price price">${GM38.formatPrice(product.price)}</div>
            <span class="token-pill">${product.tokens} токенов</span>
          </div>
          <ul class="pdp__facts">
            <li><span>Доставка</span><strong>по городу, по слотам</strong></li>
            <li><span>Сборка</span><strong>в день заказа</strong></li>
            <li><span>Оплата</span><strong>карта или СБП</strong></li>
          </ul>
          <p class="pdp__availability">${available ? "Доступен в выбранном городе" : "Сейчас недоступен в вашем городе — смените город в шапке"}</p>
          <div class="pdp__actions pdp-sticky">
            <button class="btn btn--primary btn--block" type="button" id="addBtn" ${available ? "" : "disabled"}>В корзину</button>
            <a class="btn btn--secondary btn--block" href="weekly.html">Списать токенами на витрине недели</a>
          </div>
        </div>`;
      GM38.updateChrome();
      const addBtn = document.getElementById("addBtn");
      addBtn?.addEventListener("click", () => {
        if (!GM38.addToCart(product.id, 1)) return;
        const original = addBtn.textContent;
        addBtn.textContent = "Добавлено ✓";
        addBtn.classList.add("is-added");
        setTimeout(() => {
          addBtn.textContent = original;
          addBtn.classList.remove("is-added");
        }, 1500);
      });
    });
  </script>
</body>
</html>
