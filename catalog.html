<!DOCTYPE html>
<html lang="ru">
<head>
  <script>document.documentElement.classList.add("js");</script>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5efe4" />
  <meta name="description" content="Каталог авторских букетов, открыток и подарков Gift Market 38 в Иркутске, Ангарске и Байкальске." />
  <title>Коллекция — Gift Market 38</title>
  <link rel="preload" href="assets/fonts/Fraunces.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="assets/fonts/DMSans.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body data-page="catalog" data-reload-on-city="true">
  <a class="skip-link" href="#main">Перейти к содержанию</a>
  <div data-chrome></div>
  <main class="page-main" id="main">
    <header class="page-hero">
      <div class="container page-hero__inner">
        <div>
          <p class="eyebrow">Коллекция · <span data-city-label></span></p>
          <h1 class="display display--lg">Цветы и подарки города</h1>
          <p class="lead">Букеты, открытки и наборы нескольких ателье. Выберите категорию.</p>
        </div>
      </div>
    </header>
    <div class="container page-body">
      <div class="chips" id="catChips" role="group" aria-label="Категории"></div>
      <p class="muted result-count" id="resultCount" aria-live="polite"></p>
      <div class="product-grid product-grid--catalog" id="catalogGrid"></div>
    </div>
  </main>
  <footer class="site-footer site-footer--compact">
    <div class="container">
      <div class="site-footer__bottom">
        <span>Gift Market 38 · Flower Atelier</span>
        <span>сезонный ассортимент</span>
      </div>    </div>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui-products.js"></script>
  <script src="js/chrome.js"></script>
  <script>
    let activeCat = new URLSearchParams(location.search).get("cat") || "all";
    if (!GM38.CATEGORIES.some((c) => c.id === activeCat)) activeCat = "all";
    function syncUrl(cat) {
      const url = new URL(location.href);
      if (cat === "all") url.searchParams.delete("cat");
      else url.searchParams.set("cat", cat);
      history.replaceState(null, "", url);
    }
    function render() {
      const chips = document.getElementById("catChips");
      chips.innerHTML = GM38.CATEGORIES.map((c) =>
        `<button type="button" class="chip ${c.id === activeCat ? "is-active" : ""}" data-cat="${c.id}" aria-pressed="${c.id === activeCat}">${c.name}</button>`
      ).join("");
      chips.querySelectorAll("[data-cat]").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeCat = btn.dataset.cat;
          syncUrl(activeCat);
          render();
        });
      });
      let list = GM38.productsForCity();
      if (activeCat !== "all") list = list.filter((p) => p.category === activeCat);
      document.getElementById("resultCount").textContent = `Найдено: ${list.length}`;
      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = list.length
        ? list.map(GM38.renderProductCard).join("")
        : `<div class="empty">В этом городе пока нет товаров в категории</div>`;
      GM38.bindAddButtons(grid);
    }
    document.addEventListener("DOMContentLoaded", render);
  </script>
</body>
</html>
