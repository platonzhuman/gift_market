<!DOCTYPE html>
<html lang="ru">
<head>
  <script>document.documentElement.classList.add("js");</script>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5efe4" />
  <meta name="description" content="Корзина Gift Market 38 — выбранные букеты и подарки." />
  <title>Корзина — Gift Market 38</title>
  <link rel="preload" href="assets/fonts/Fraunces.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="assets/fonts/DMSans.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body data-page="cart" data-reload-on-city="true">
  <a class="skip-link" href="#main">Перейти к содержанию</a>
  <div data-chrome></div>
  <main class="page-main" id="main">
    <header class="page-hero">
      <div class="container">
        <p class="eyebrow">Корзина · <span data-city-label></span></p>
        <h1 class="display display--lg">Ваш заказ</h1>
      </div>
    </header>
    <div class="container page-body">
      <div id="cartRoot" class="cart-layout"></div>
    </div>
  </main>
  <footer class="site-footer site-footer--compact">
    <div class="container">
      <div class="site-footer__bottom">
        <span>Корзина · Gift Market 38</span>
        <span>Gift Market 38</span>
      </div>
    </div>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chrome.js"></script>
  <script>
    function renderCart() {
      const root = document.getElementById("cartRoot");
      if (!GM38.state.cart.length) {
        root.innerHTML = `<div class="empty panel">Корзина пуста.<br/><br/><a class="btn btn--primary" href="catalog.html">Перейти в каталог</a></div>`;
        return;
      }
      const items = GM38.state.cart.map((item) => {
        const p = GM38.getProduct(item.productId);
        if (!p) return "";
        const store = GM38.getStore(p.storeId);
        return `
          <article class="cart-item">
            <img src="${p.image}" alt="${p.name}" width="96" height="120" loading="lazy" />
            <div class="cart-item__body">
              <div class="cart-item__head">
                <div class="product-card__store">${store ? store.name : "Ателье"}</div>
                <button class="cart-item__remove" type="button" data-remove="${p.id}" aria-label="Удалить ${p.name}">Удалить</button>
              </div>
              <h2 class="cart-item__title">${p.name}</h2>
              <div class="cart-item__price">
                <span class="price">${GM38.formatPrice(p.price * item.qty)}</span>
                <span class="muted">${GM38.formatPrice(p.price)} × ${item.qty}</span>
              </div>
              <div class="qty">
                <button type="button" data-qty="${p.id}" data-delta="-1" aria-label="Уменьшить количество">−</button>
                <span aria-live="polite">${item.qty}</span>
                <button type="button" data-qty="${p.id}" data-delta="1" aria-label="Увеличить количество">+</button>
              </div>
            </div>
          </article>`;
      }).join("");

      root.innerHTML = `
        <div class="panel">
          <div class="panel__head">
            <h2 class="display display--md">Состав заказа</h2>
            <span class="muted">${GM38.cartCount()} поз.</span>
          </div>
          ${items}
        </div>
        <div class="summary stack">
          <div class="row"><span class="muted">Итого</span><strong class="price">${GM38.formatPrice(GM38.cartTotal())}</strong></div>
          <p class="summary__note">Оплата картой или СБП при оформлении.</p>
          <a class="btn btn--primary btn--block" href="checkout.html">К оформлению</a>
        </div>`;

      root.querySelectorAll("[data-qty]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-qty");
          const delta = Number(btn.getAttribute("data-delta"));
          const line = GM38.state.cart.find((i) => i.productId === id);
          if (!line) return;
          GM38.setCartQty(id, line.qty + delta);
          renderCart();
        });
      });

      root.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", () => {
          GM38.setCartQty(btn.getAttribute("data-remove"), 0);
          GM38.toast("Товар удалён из корзины");
          renderCart();
        });
      });
    }
    document.addEventListener("DOMContentLoaded", renderCart);
  </script>
</body>
</html>
