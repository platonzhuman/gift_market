<!DOCTYPE html>
<html lang="ru">
<head>
  <script>document.documentElement.classList.add("js");</script>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5efe4" />
  <meta name="description" content="Заказ Gift Market 38 оформлен." />
  <title>Готово — Gift Market 38</title>
  <link rel="preload" href="assets/fonts/Fraunces.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="assets/fonts/DMSans.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body data-page="cart">
  <a class="skip-link" href="#main">Перейти к содержанию</a>
  <div data-chrome></div>
  <main class="page-main" id="main">
    <div class="container page-body">
      <div class="success-card stack" id="successRoot"></div>
    </div>
  </main>
  <footer class="site-footer site-footer--compact">
    <div class="container">
      <div class="site-footer__bottom">
        <span>Заказ · Gift Market 38</span>
        <span>Flower Atelier</span>
      </div>
    </div>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chrome.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(location.search);
      const type = params.get("type");
      const root = document.getElementById("successRoot");
      const cityName = (cityId) => (GM38.CITIES.find((c) => c.id === cityId) || GM38.getCity()).name;

      if (type === "tokens") {
        const p = GM38.getProduct(params.get("id"));
        const spent = p ? p.tokens : 0;
        document.title = "Подарок выбран — Gift Market 38";
        root.innerHTML = `
          <p class="eyebrow">Токены списаны</p>
          <h1>Подарок недели выбран</h1>
          <p class="muted">${p ? p.name : "Заказ"} · <span data-city-label></span></p>
          <div class="success-card__summary">
            <div class="row"><span>Списано токенов</span><strong>−${spent}</strong></div>
            <div class="row"><span>Остаток на балансе</span><strong><span data-token-balance>0</span></strong></div>
          </div>
          <p class="muted">Мы передали заказ ателье — осталось подтвердить слот доставки.</p>
          <a class="btn btn--primary" href="weekly.html">Вернуться к витрине</a>
          <a class="btn btn--secondary" href="catalog.html">В каталог</a>`;
      } else {
        const orderId = params.get("id");
        const order = GM38.state.orders.find((o) => o.id === orderId && o.type === "cart");
        const items = order
          ? order.items.map((item) => {
              const p = GM38.getProduct(item.productId);
              if (!p) return "";
              return `<div class="row"><span>${p.name} × ${item.qty}</span><span>${GM38.formatPrice(p.price * item.qty)}</span></div>`;
            }).join("")
          : "";
        document.title = "Заказ принят — Gift Market 38";
        root.innerHTML = `
          <p class="eyebrow">Оплата прошла</p>
          <h1>Заказ принят</h1>
          <p class="muted">Номер: ${orderId || "—"} · город: <span data-city-label>${order ? cityName(order.cityId) : ""}</span></p>
          ${order ? `<div class="success-card__summary">${items}<div class="row success-card__total"><strong>Итого</strong><strong>${GM38.formatPrice(order.total)}</strong></div></div>` : ""}
          <p class="muted">Мы свяжемся с вами, чтобы подтвердить слот доставки.</p>
          <a class="btn btn--primary" href="catalog.html">Продолжить покупки</a>
          <a class="btn btn--secondary" href="index.html">На главную</a>`;
      }
      GM38.updateChrome();
    });
  </script>
</body>
</html>
